# /etc/nginx/conf.d/records.conf — records.ninja-portal.com → the studio.
# certbot --nginx -d records.ninja-portal.com adds the TLS block after the
# DNS A record exists. Webhook bodies are small; audio downloads are served
# by the app (private paths), so no static root here.
server {
    listen 80;
    server_name records.ninja-portal.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
