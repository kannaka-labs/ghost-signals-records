# /etc/nginx/conf.d/records.conf — records.ninja-portal.com → the studio.
# This is the file as it stands on the box AFTER certbot (--nginx -d
# records.ninja-portal.com) added the TLS lines; the :80 server only redirects.
# Webhook bodies are small; audio downloads are served by the app (private
# paths), so no static root here.
#
# The one large request is the cover runner's upload (an SDXL PNG, 1-3 MB) to
# /internal/covers/: it gets its own 4m limit. It MUST be in the 443 server,
# which is where the runner's HTTPS lands; in the :80 server it would change
# nothing and the uploads would 413 at the 1m default.
server {
    server_name records.ninja-portal.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /internal/covers/ {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/records.ninja-portal.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/records.ninja-portal.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = records.ninja-portal.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name records.ninja-portal.com;
    return 404; # managed by Certbot
}
